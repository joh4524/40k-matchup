<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40K 軍表工具</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#dcdad4;--a:#1f5fbf}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--card:#222226;--ink:#ececee;--mute:#9a9aa2;--line:#3a3a40;--a:#7fb0ff}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh}
header{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:6px 16px 0}
.top{max-width:1200px;margin:0 auto;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.top b{font-size:17px}
.top small{color:var(--mute)}
nav{max-width:1200px;margin:4px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:7px 12px;color:var(--mute);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
nav a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--a)}
#frames{flex:1;position:relative;min-height:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#frames iframe.on{display:block}
.top .pv{margin-left:auto;font-size:12px;color:var(--mute)}
nav .s{display:none}
@media (max-width:600px){header{padding:4px 8px 0}.top b{font-size:15px}.top small{display:none}nav{justify-content:space-between}nav a{padding:6px 7px}nav .l{display:none}nav .s{display:inline}}
</style>
</head>
<body>
<header>
  <div class="top"><b>40K 軍表工具</b><small>第十一版・非官方，與 Games Workshop 無關</small><a class="pv" href="privacy.html" target="_blank" rel="noopener">隱私權</a></div>
  <nav id="tabs"></nav>
</header>
<div id="frames"></div>
<script src="browser.js?v=202611270301"></script>
<script>
// 首頁＝分頁殼（2026-11-24）：每個工具還是原本的 .html，放在 iframe 裡，第一次點到才載入，切換時結果留著。
// 計算程式（公開版的 Pyodide）只在這一層載入一次，各分頁透過 lists.js 共用。
const TABS = [
  ['matchup', '對戰計算', 'matchup.html', '對戰'],
  ['listcheck', '軍表健檢', 'listcheck.html', '健檢'],
  ['scout', '偵察小抄', 'scout.html', '小抄'],
  ['dice', '骰子機率', 'dice.html', '骰子'],
  ['leaderboards', '單位排行', 'leaderboards.html', '排行'],
  ['print', '印軍表', 'print.html', '列印'],
  ['paints', '顏料配對', 'paints.html', '顏料'],
  ['meta', 'Meta 表', 'metalists/', 'Meta']
];
const nav = document.getElementById('tabs'), box = document.getElementById('frames'), frames = {};
// 手機上分頁名用短的（2026-11-24，原本要橫滑才看得到後面兩個）
// 「印軍表」只在 HP 版顯示（2026-11-25，公開版有 localCalc，規則全文不放公開網站）
nav.innerHTML = TABS.map(([k, t, , sh]) => '<a href="#' + k + '" data-k="' + k + '"' + (k === 'meta' || (k === 'print' && window.localCalc) ? ' style="display:none"' : '') + '><span class="l">' + t + '</span><span class="s">' + sh + '</span></a>').join('');
function show() {
  let k = location.hash.slice(1);
  if (!TABS.some((t) => t[0] === k)) k = 'matchup';
  const tab = TABS.find((t) => t[0] === k);
  if (!frames[k]) {
    const f = document.createElement('iframe');
    f.src = tab[2];
    f.title = tab[1];
    box.appendChild(f);
    frames[k] = f;
  }
  Object.entries(frames).forEach(([n, f]) => f.classList.toggle('on', n === k));
  nav.querySelectorAll('a').forEach((a) => a.classList.toggle('on', a.dataset.k === k));
  const on = nav.querySelector('a.on');
  if (on && on.scrollIntoView) on.scrollIntoView({block: 'nearest', inline: 'nearest'});
  document.title = tab[1] + '｜40K 軍表工具';
}
window.addEventListener('hashchange', show);
show();
// Meta 表分頁：網站上有 metalists/ 才顯示
fetch('metalists/data/index.json').then((r) => { if (r.ok) nav.querySelector('[data-k=meta]').style.display = ''; }).catch(() => {});
</script>
</body>
</html>
