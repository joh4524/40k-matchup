<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>軍表對戰計算</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#dcdad4;--a:#1f5fbf;--b:#b3402a;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--card:#222226;--ink:#ececee;--mute:#9a9aa2;--line:#3a3a40;--a:#7fb0ff;--b:#ff9a85;--warn:#e0b050}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
textarea{width:100%;height:170px;font:12px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
label.t{font-weight:600;display:block;margin-bottom:4px}
.la{color:var(--a)}.lb{color:var(--b)}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.opts label{white-space:nowrap}
button{font:inherit;padding:8px 18px;border-radius:8px;border:0;background:var(--a);color:#fff;font-weight:600}
.seg button{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:5px 12px;font-weight:400}
.seg button.on{background:var(--ink);color:var(--bg)}
.kpi{display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.kpi b{font-size:18px}
.kpi span{color:var(--mute);font-size:12px;display:block}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:center}
th.r,td.r{text-align:left;position:sticky;left:0;background:var(--card);max-width:190px;min-width:130px}
thead th{font-weight:600;vertical-align:bottom;min-width:64px;max-width:90px;font-size:11px;line-height:1.25}
td.c{color:#111}
small,.mute{color:var(--mute)}
details{margin-top:6px}summary{cursor:pointer}
ul{margin:4px 0;padding-left:20px}
.warn{color:var(--warn)}
.err{color:var(--b);font-weight:600}
td.chg{outline:2px solid var(--ink);outline-offset:-2px}
td.c small{display:block;font-size:10px;color:#111}
.note{background:var(--bg);border-radius:8px;padding:6px 10px;margin:0 0 12px}
#tip{position:fixed;left:8px;right:8px;bottom:8px;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;display:none;z-index:9;box-shadow:0 4px 16px #0004}
td.c{cursor:pointer}
/* 手機（2026-11-15）：第一欄變窄、表格字小一點；「該先打誰」改成一列一張小卡，不用左右滑 */
@media (max-width:600px){
  main{padding:10px}
  .card{padding:10px}
  th.r,td.r{min-width:92px;max-width:110px;font-size:11px}
  thead th{min-width:46px;font-size:10px}
  th,td{padding:3px 4px}
  button{padding:8px 14px}
  table.thr,table.thr tbody{display:block;width:100%}
  table.thr thead{display:none}
  table.thr tr{display:block;border:1px solid var(--line);border-radius:8px;margin:0 0 8px;padding:4px 0}
  table.thr td{display:flex;justify-content:space-between;gap:12px;border:0;text-align:right!important;position:static;max-width:none;min-width:0;background:none;padding:2px 8px}
  table.thr td::before{content:attr(data-l);color:var(--mute);text-align:left;white-space:nowrap}
  table.thr td.r{font-weight:600;font-size:13px}
}
</style>
</head>
<body>
<main>
<h1>軍表對戰計算 <small>40K 第十一版</small></h1>
<div class="card">
  <div class="grid">
    <div><label class="t la" for="a">我方軍表（A）</label><textarea id="a" placeholder="貼上官方 App 匯出的軍表文字"></textarea></div>
    <div><label class="t lb" for="b">對方軍表（B）</label><textarea id="b" placeholder="貼上官方 App 匯出的軍表文字"></textarea></div>
  </div>
  <div class="opts" style="margin-top:8px">
    <button id="go">計算</button>
    <button id="tr" type="button" style="background:var(--bg);color:var(--ink);border:1px solid var(--line)">英文軍表翻成中文</button>
    <label><input type="checkbox" id="half"> 半射程內（Rapid Fire、Melta）</label>
    <label><input type="checkbox" id="cover"> 目標有掩體</label>
    <label><input type="checkbox" id="charge"> 近戰是衝鋒（Lance）</label>
    <label><input type="checkbox" id="still"> 沒移動（Heavy）</label>
  </div>
  <div id="msg" class="err"></div>
</div>
<div id="tip" onclick="this.style.display='none'"></div>
<div id="trout"></div>
<div id="out"></div>
<p class="mute" style="font-size:12px">
算的是平均值：每個單位打一輪（射擊一次或近戰一次），平均殺掉目標幾 %。算武器數值和關鍵字、讀得懂的單位能力、軍隊規則、分隊規則、戰略、強化（禁軍是手動整理的，其他陣營自動讀）。
扣血一隻一隻扣（受傷的先接、角色最後接）。<b>不算</b>：射程、視線、移動、衝鋒骰、士氣。
資料來源：<a href="https://wahapedia.ru/wh40k11ed/the-rules/data-export/" rel="noopener">Wahapedia 資料匯出檔</a>（Powered by Wahapedia）<span id="upd"></span>。中文單位名對照自官方點數網站。
非官方工具，與 Games Workshop 無關；Warhammer 40,000 及相關名稱是 Games Workshop 的商標。
</p>
</main>
<script src="browser.js?v=202611152002"></script>
<script>
const $=id=>document.getElementById(id);
let R=null, mode='both', tsort='score', pv='points', over={a:{},b:{}}, last={a:'',b:''}, P=null, view='sum', SC={rev:false,melee:false,att:[],tgt:[]}, SR=null;
const pct=v=>Math.round(v*100);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function val(c){return mode==='shoot'?c[0]:mode==='melee'?c[1]:1-(1-c[0])*(1-c[1]);}
function color(v){const h=v>=.5?140:v>=.25?75:v>=.1?45:0;return v<.03?'transparent':`hsl(${h} 70% ${88-v*28}%)`;}
function matrix(title,cls,att,def,m,pm){
  let h=`<div class="card"><h2 class="${cls}">${title}</h2><div class="scroll"><table><thead><tr><th class="r">打的單位 ↓　目標 →</th>`;
  def.units.forEach(u=>h+=`<th>${esc(u.name)}<br><small>${u.points} 分</small></th>`);
  h+='</tr></thead><tbody>';
  att.units.forEach((u,i)=>{h+=`<tr><td class="r">${esc(u.name)} <small>${u.points}</small></td>`;
    m[i].forEach((c,j)=>{const v=val(c),d=pm?pct(v)-pct(val(pm[i][j])):0;h+=`<td class="c${d?' chg':''}" style="background:${color(v)}" title="射擊 ${pct(c[0])}%　近戰 ${pct(c[1])}%" data-tip="${esc(u.name)} 打 ${esc(def.units[j].name)}：射擊 ${pct(c[0])}%　近戰 ${pct(c[1])}%${c.length>2&&(pct(c[2])!==pct(c[0])||pct(c[3])!==pct(c[1]))?`（對方模型血量不一樣，這是對方接得好的數字；接得不好會到 射擊 ${pct(c[2])}%　近戰 ${pct(c[3])}%）`:''}">${v<.005&&!d?'<span class="mute">·</span>':pct(v)+'%'}${d?`<small>${d>0?'▲':'▼'}${Math.abs(d)}</small>`:''}</td>`});h+='</tr>'});
  return h+'</tbody></table></div></div>';
}
// 每個單位的完整資料（2026-11-15，使用者「你把所有單位的資料都加上」，讓使用者自己驗算）
function fullData(u,s){
  const st=new Map(u.abil.map(x=>[x.name,x.on?'有算':'有讀到、沒勾']));
  const army=(s.dets||[]).filter(d=>d.army&&d.on).map(d=>d.name.replace('軍隊規則：',''));
  const status=a=>{
    if(st.has(a.name)) return st.get(a.name);
    const k=[...st.keys()].find(n=>a.name.startsWith(n+' ('));          // 資料裡的名字帶「(Once per battle…)」
    if(k) return st.get(k);
    if(/^Feel No Pain/.test(a.name)&&!a.model) return '有算';
    if(a.name==='Stealth') return '有算';
    if(a.type==='Faction'&&army.includes(a.name)) return '有算（看上面軍隊規則）';
    return '沒算';
  };
  let h=`<div style="margin:10px 0;border-top:1px solid var(--line,#ddd);padding-top:6px"><b>${esc(u.name)}</b> <small>${u.points} 分</small>`;
  u.data.forEach(g=>{
    h+=`<div style="margin:4px 0 2px"><small>${g.count}× ${esc(g.name)}${g.src&&g.src!==g.name?'（'+esc(g.src)+'）':''}｜M${g.M}" T${g.T} Sv${g.Sv}+ ${g.inv?'無敵'+g.inv+'+ ':''}W${g.W}</small></div>`;
    if(g.weapons.length) h+=`<div class="scroll"><table><thead><tr><th class="r">武器</th><th>幾把</th><th>射程</th><th>A</th><th>BS/WS</th><th>S</th><th>AP</th><th>D</th><th style="max-width:none">武器能力</th></tr></thead><tbody>${g.weapons.map(w=>`<tr><td class="r">${esc(w.name)}</td><td>${w.n}</td><td>${esc(w.range)}${/^\d+$/.test(w.range)?'"':''}</td><td>${esc(w.A)}</td><td>${w.skill&&w.skill!=='-'?esc(w.skill)+'+':'-'}</td><td>${esc(w.S)}</td><td>${esc(w.AP)}</td><td>${esc(w.D)}</td><td style="text-align:left">${esc(w.kw)||'<span class="mute">無</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  });
  u.info.forEach(i=>{
    const ab=i.abil.filter(a=>a.name!=='Leader');
    if(ab.length) h+=`<div><small>${u.info.length>1?esc(i.src)+' 的':''}能力：${ab.map(a=>{const x=status(a);return `${esc(a.name)}${a.model?' <span class="mute">('+esc(a.model)+')</span>':''} <span class="${x==='沒算'?'mute':''}">[${x}]</span>`}).join('、')}</small></div>`;
  });
  const enh=u.abil.filter(x=>x.name.startsWith('強化 '));
  if(enh.length) h+=`<div><small>強化：${enh.map(x=>esc(x.name.slice(3))+' ['+(x.on?'有算':'有讀到、沒勾')+']').join('、')}</small></div>`;
  return h+'</div>';
}
function sideCard(s,cls,tag,sum,other,sk){
  let h=`<div class="card"><h2 class="${cls}">${tag}：${esc(s.name||'（沒名字）')} <small>${esc(s.faction)}</small></h2>
  <div class="kpi"><div><b>${s.points}</b><span>分</span></div><div><b>${s.units.length}</b><span>單位</span></div><div><b>${s.models}</b><span>模型</span></div>
  <div><b>${s.wounds}</b><span>總傷數</span></div><div><b>${s.oc}</b><span>總 OC</span></div>
  <div><b>${sum.shoot_pts}</b><span>射擊一輪殺分*</span></div><div><b>${sum.melee_pts}</b><span>近戰一輪殺分*</span></div></div>`;
  if(sum.no_answer.length) h+=`<p><b>${tag} 難處理的對方單位</b>（沒有單位一輪能打掉 25%）：<br>${sum.no_answer.map(x=>`${esc(x.unit)} <small>最多 ${pct(x.best)}%</small>`).join('、')}</p>`;
  else h+=`<p class="mute">對方每個單位，${tag} 都有單位一輪能打掉 25% 以上。</p>`;
  if(s.unknown.length) h+=`<p class="warn">找不到資料、沒算進去的單位：${s.unknown.map(esc).join('、')}</p>`;
  h+=`<details><summary>單位數值（${s.units.length}）</summary><div class="scroll"><table><thead><tr><th class="r">單位</th><th>分</th><th>模型</th><th>M</th><th>T</th><th>Sv</th><th>無敵</th><th>W</th><th>FNP</th><th>OC</th><th style="max-width:none">算進去的武器</th></tr></thead><tbody>`;
  s.units.forEach(u=>h+=`<tr><td class="r">${esc(u.name)}</td><td>${u.points}</td><td>${u.models}</td><td>${u.M}"</td><td>${u.T}</td><td>${u.Sv}+</td><td>${u.inv?u.inv+'+':'-'}</td><td>${u.W}</td><td>${u.fnp?u.fnp+'+':'-'}</td><td>${u.OC}</td><td style="text-align:left">${u.weapons.map(esc).join('、')}</td></tr>`);
  h+='</tbody></table></div></details>';
  h+=`<details${window['fopen_'+sk]?' open':''} data-fd="${sk}"><summary>每個單位的完整資料（驗算用：程式用的數值、武器、能力）</summary>${s.units.map(u=>fullData(u,s)).join('')}<small>資料來源：Wahapedia 第十一版匯出檔。能力標「有算」＝這條有加進計算；「有讀到、沒勾」＝程式讀得懂但預設不算（要看條件），可以到下面「單位能力」勾；「沒算」＝讀不懂或跟傷害無關。</small></details>`;
  if(s.notes.length) h+=`<details><summary class="warn">讀軍表時的註記（${s.notes.length}）</summary><ul>${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></details>`;
  const ab=s.units.filter(u=>u.abil.length), nab=ab.reduce((n,u)=>n+u.abil.length,0);
  if(nab) h+=`<details${window['open_'+sk]?' open':''} data-ab="${sk}"><summary>單位能力（讀到 ${nab} 條，打勾的有算進去）</summary>${ab.map(u=>`<div style="margin:6px 0"><b>${esc(u.name)}</b>${u.abil.map(x=>`<br><label style="${x.avail?'':'opacity:.5'}"><input type="checkbox" data-side="${sk}" data-key="${esc(x.key)}" ${x.on?'checked':''} ${x.avail?'':'disabled'}> ${esc(x.name)}：<small>${esc(x.label)}${x.avail?'':'（'+esc(x.why||'不適用')+'）'}</small></label>`).join('')}</div>`).join('')}<small>只讀得懂固定句型的能力（自己攻擊時、被打時的加減和重骰）。沒列出來的能力就是沒算。</small></details>`;
  else h+=`<p class="mute" style="margin:6px 0 0">這張表的單位沒有讀到會影響傷害的固定句型能力。</p>`;
  const dets=s.dets||[], don=dets.filter(d=>d.on);
  if(dets.length) h+=`<details${window['dopen_'+sk]?' open':''} data-dt="${sk}"><summary>分隊規則和戰略（${don.length?don.map(d=>esc(d.name)).join('、'):'還沒選分隊'}）</summary>
  <div style="margin:6px 0"><small>${dets.some(d=>d.auto)?'已照軍表裡的分隊名自動勾選，可以改。':'軍表是中文或沒讀到分隊名，請自己勾用了哪幾個分隊（可多選）。'}括號是讀得懂的規則／戰略條數。</small>
  <div class="opts" style="gap:2px 14px;margin-top:4px">${dets.map(d=>`<label style="white-space:normal"><input type="checkbox" data-side="${sk}" data-key="${esc(d.key)}" ${d.on?'checked':''}> ${esc(d.name)} <small>(${d.n})</small></label>`).join('')}</div></div>
  ${don.map(d=>`<div style="margin:10px 0 6px"><b>${esc(d.name)}</b>${d.rules.length?d.rules.map(x=>`<br><label><input type="checkbox" data-side="${sk}" data-key="${esc(x.key)}" ${x.on?'checked':''}> ${x.kind==='戰略'?'戰略 '+esc(x.cp)+'CP':esc(x.kind)}｜${esc(x.name)}：<small>${esc(x.label)}${x.need.length?'（'+x.need.map(esc).join('，')+'）':''}</small></label>`).join(''):'<br><small class="mute">沒有讀得懂、會影響傷害的規則或戰略</small>'}<br><small class="mute">另有 ${d.unread} 條讀不懂或跟傷害無關，沒列出來</small></div>`).join('')}
  <small>規則和戰略預設都不算，勾了才算。勾戰略＝假設每個符合條件的單位都用了它，用來看「用了會差多少」。標「衝鋒時／半射程內／沒移動時」的，要同時勾最上面那個選項。</small></details>`;
  h+=`<details><summary>每個單位最賺的目標</summary><div class="scroll"><table><thead><tr><th class="r">單位</th><th style="max-width:none">射擊最賺</th><th>殺分</th><th style="max-width:none">近戰最賺</th><th>殺分</th></tr></thead><tbody>${sum.best.map(x=>`<tr><td class="r">${esc(x.unit)}</td><td>${esc(x.shoot)}</td><td>${x.shoot_pts}</td><td>${esc(x.melee)}</td><td>${x.melee_pts}</td></tr>`).join('')}</tbody></table></div></details>`;
  return h+'</div>';
}
function threatCard(tag,cls,foeTag,list){
  const rows=list.map((t,i)=>({...t,i})).sort((x,y)=>y[tsort]-x[tsort]||y.threat-x.threat);
  let h=`<div class="card"><h2 class="${cls}">${tag} 該先打誰（${foeTag} 的威脅）</h2><div class="scroll"><table class="thr"><thead><tr><th>#</th><th class="r">${foeTag} 的單位</th><th>威脅<br><small>一輪殺我幾分</small></th><th>射擊</th><th>近戰</th><th style="max-width:none;min-width:150px">一輪能帶走我的</th><th style="max-width:none;min-width:170px">打掉它要派</th><th>要花<br><small>火力（分）</small></th><th>優先<br><small>分數</small></th></tr></thead><tbody>`;
  rows.forEach((t,n)=>{
    const kills=t.kills.length?t.kills.map(k=>`${esc(k.unit)} <small>${pct(k.pct)}%</small>`).join('<br>'):'<span class="mute">沒有</span>';
    const used=t.can?t.used.map(k=>`${esc(k.unit)} <small>${pct(k.pct)}%</small>`).join('<br>'):`<span class="warn">全軍一輪打不掉<br>最多 ${pct(t.max_pct)}%</span>`;
    h+=`<tr><td data-l="排名">${n+1}</td><td class="r" data-l="${foeTag}"><span>${esc(t.unit)} <small>${t.points}</small></span></td><td data-l="威脅（一輪殺我幾分）"><b>${t.threat}</b></td><td data-l="射擊">${t.shoot}</td><td data-l="近戰">${t.melee}</td><td data-l="一輪能帶走我的" style="text-align:left"><span>${kills}</span></td><td data-l="打掉它要派" style="text-align:left"><span>${used}</span></td><td data-l="要花火力（分）">${t.cost||'-'}</td><td data-l="優先分數"><b>${t.score}</b></td></tr>`});
  return h+'</tbody></table></div></div>';
}
// 一整回合火力分配（2026-11-15，使用者選「2」）：貪心法。每一步挑「多打掉最多價值」的 打的單位→目標，
// 同一個目標被打的 % 直接相加、到 100% 為止（平均值的近似，不算骰子變異）。先分射擊，射擊打剩的再分近戰。
function plan(att,def,m,thr){
  const val=def.units.map((u,j)=>pv==='threat'&&thr&&thr[j]&&thr[j].unit===u.name?Math.max(1,thr[j].threat):u.points);
  const cur=def.units.map(()=>0), out=att.units.map(()=>({s:null,m:null}));
  for(const ph of [0,1]){
    const left=new Set(att.units.map((u,i)=>i).filter(i=>m[i].some(c=>c[ph]>0.005)));
    while(left.size){
      let best=null;
      left.forEach(i=>m[i].forEach((c,j)=>{const add=Math.min(1,cur[j]+c[ph])-Math.min(1,cur[j]);const g=add*val[j];if(g>0.0001&&(!best||g>best.g))best={i,j,g,add}}));
      if(!best)break;
      cur[best.j]+=best.add; out[best.i][ph?'m':'s']={j:best.j,p:best.add,raw:m[best.i][best.j][ph]}; left.delete(best.i);
    }
  }
  return {out,cur};
}
function planCard(tag,cls,foeTag,att,def,m,thr){
  const {out,cur}=plan(att,def,m,thr);
  const cell=x=>x?`${esc(def.units[x.j].name)} <small>${pct(x.raw)}%${x.p<x.raw-0.005?`（有效 ${pct(x.p)}%）`:''}</small>`:'<span class="mute">—</span>';
  let h=`<div class="card"><h2 class="${cls}">${tag} 這一回合怎麼打（自動分配）</h2><div class="opts seg" style="margin-bottom:8px"><span>以什麼為優先：</span><button data-pv="points" class="${pv==='points'?'on':''}">打掉最多分數</button><button data-pv="threat" class="${pv==='threat'?'on':''}">打掉最多威脅</button></div>
  <div class="scroll"><table class="thr"><thead><tr><th class="r">${tag} 的單位</th><th style="max-width:none;min-width:160px">射擊打</th><th style="max-width:none;min-width:160px">近戰打</th></tr></thead><tbody>`;
  att.units.forEach((u,i)=>h+=`<tr><td class="r" data-l="${tag}"><span>${esc(u.name)} <small>${u.points}</small></span></td><td data-l="射擊打" style="text-align:left"><span>${cell(out[i].s)}</span></td><td data-l="近戰打" style="text-align:left"><span>${cell(out[i].m)}</span></td></tr>`);
  h+='</tbody></table></div>';
  const hit=def.units.map((u,j)=>({u,j,c:Math.min(1,cur[j])})).filter(x=>x.c>0.005).sort((a,b)=>b.c-a.c);
  const pts=hit.reduce((n,x)=>n+x.c*x.u.points,0);
  h+=`<p style="margin:8px 0 4px"><b>預計這一回合打掉 ${foeTag} 約 ${Math.round(pts)} 分</b>（全滅 ${hit.filter(x=>x.c>=.995).length} 個單位）</p><p style="margin:0">${hit.map(x=>`${esc(x.u.name)} <small>${pct(x.c)}%</small>`).join('、')||'<span class="mute">打不到任何單位</span>'}</p>
  <small>做法：每一步挑「多打掉最多${pv==='threat'?'威脅':'分數'}」的組合，打同一個目標的 % 直接相加、到 100% 為止（平均值，沒算運氣）。先排射擊、射擊打剩的再排近戰，近戰假設衝得到。「有效」＝扣掉已經被打掉的部分後真正有用的 %。沒算射程、視線、移動。</small></div>`;
  return h;
}
function changed(m,pm){let n=0;m.forEach((r,i)=>r.forEach((c,j)=>{if(pct(val(c))!==pct(val(pm[i][j])))n++}));return n}
// 每個選項值多少（2026-11-15，使用者「給我看細節差異 例如六種武藝要不要開cp」）
function valuesCard(tag,cls,list){
  if(!list) return `<div class="card"><h2 class="${cls}">${tag} 每個選項值多少</h2><p>每條分隊規則、戰略、Ka'tah 招式各自開和不開都算一次，看用在哪個單位最賺、多殺幾分或少被殺幾分。<br><button id="wv_${tag}">算每個選項值多少</button> <small class="mute">會多花幾秒；算過之後每次重算都會一起算。</small></p></div>`;
  if(!list.length) return `<div class="card"><h2 class="${cls}">${tag} 每個選項值多少</h2><p class="mute">沒有讀得懂、會影響傷害的規則或戰略（要先勾用了哪些分隊）。</p></div>`;
  let h=`<div class="card"><h2 class="${cls}">${tag} 每個選項值多少</h2><div class="scroll"><table class="thr"><thead><tr><th class="r">選項</th><th>種類</th><th>值<br><small>多殺＋少被殺（分）</small></th><th>每 CP</th><th style="max-width:none;min-width:200px">最適合的單位（多殺／少被殺）</th></tr></thead><tbody>`;
  list.forEach(v=>{h+=`<tr><td class="r" data-l="選項"><span>${esc(v.name)}<br><small class="mute">${esc(v.det)}${v.on?'｜現在有算':''}</small></span></td><td data-l="種類">${esc(v.kind)}${v.cp?' '+v.cp+'CP':''}</td><td data-l="值"><b>${v.gain}</b></td><td data-l="每 CP">${v.per_cp??'-'}</td><td data-l="最適合的單位" style="text-align:left"><span>${v.units.length?v.units.slice(0,3).map(x=>`${esc(x.unit)} <small>${x.off?'+'+x.off+' 殺':''}${x.off&&x.deff?'、':''}${x.deff?'少被殺 '+x.deff:''}</small>`).join('<br>'):'<span class="mute">這場沒有用處</span>'}</span></td></tr>`});
  return h+`</tbody></table></div><small>戰略＝只用在一個單位，值是用在最適合的那隊；規則＝所有符合的單位一起有，值是加總。射擊：多殺＝那隊射最賺的目標多殺的分數，少被殺＝對面射它最痛的一隊少殺的分數。近戰照「我方衝鋒先打、對面剩下的才打回來」算：多殺的分數，加上因為對面剩得少（或防守招）少被打回來的分數。被對面衝鋒的情況沒算。Ka'tah 每招分開算（每隊每輪只能用一招），Superhuman Focus 是讓同一隊再多用一招。Challenger 戰略要分數落後才能用。條件（目標點上、低於半數等）都當作成立。</small></div>`;
}
// 總覽用的精簡版：只有分數和警告
function sideMini(s,cls,tag,sum){
  let h=`<div class="card"><h2 class="${cls}">${tag}：${esc(s.name||'（沒名字）')} <small>${esc(s.faction)}</small></h2>
  <div class="kpi"><div><b>${s.points}</b><span>分</span></div><div><b>${s.units.length}</b><span>單位</span></div><div><b>${s.wounds}</b><span>總傷數</span></div>
  <div><b>${sum.shoot_pts}</b><span>射擊一輪殺分*</span></div><div><b>${sum.melee_pts}</b><span>近戰一輪殺分*</span></div></div>`;
  const on=(s.dets||[]).filter(d=>d.on).map(d=>d.name);
  if(on.length) h+=`<p class="mute" style="margin:6px 0 0">有算：${on.map(esc).join('、')}（到「規則和數據」改）</p>`;
  if(s.unknown.length) h+=`<p class="warn">找不到資料、沒算進去的單位：${s.unknown.map(esc).join('、')}</p>`;
  return h+'</div>';
}
// 單位測試（2026-11-15，使用者：「兩隊終結者可以射擊 對面是太陽領主和科技技師 我要怎麼分槍」）
function testCard(){
  const me=SC.rev?R.b:R.a, foe=SC.rev?R.a:R.b, mt=SC.rev?'B':'A', ft=SC.rev?'A':'B';
  const box=(list,k)=>list.units.map((u,i)=>`<label style="white-space:normal;display:block"><input type="checkbox" data-sc="${k}" value="${i}" ${SC[k].includes(i)?'checked':''}> ${esc(u.name)} <small>${u.points}</small></label>`).join('');
  let h=`<div class="card"><h2>單位測試：選誰出手、打誰，程式幫你分槍</h2>
  <div class="opts seg" style="margin-bottom:6px"><span>誰出手：</span><button data-scr="0" class="${!SC.rev?'on':''}">A 打 B</button><button data-scr="1" class="${SC.rev?'on':''}">B 打 A</button>
  <span style="margin-left:10px">階段：</span><button data-scm="0" class="${!SC.melee?'on':''}">射擊</button><button data-scm="1" class="${SC.melee?'on':''}">近戰</button></div>
  <div class="grid"><div><b class="${SC.rev?'lb':'la'}">${mt} 出手的單位</b>${box(me,'att')}</div><div><b class="${SC.rev?'la':'lb'}">${ft} 的目標</b>${box(foe,'tgt')}</div></div>
  <p><button id="scgo">幫我分槍</button> <small class="mute">每把武器都可以分開打不同目標。程式找「平均打死的分數」最多的分法：打殘沒死的幾乎不算分，所以會傾向集火確保打死。上面的半射程、掩體、衝鋒、沒移動選項都會套用。</small></p><div id="scmsg" class="err"></div></div>`;
  if(SR&&!SR.error){
    h+=`<div class="card"><h2>建議分法：平均打死 ${SR.total} 分</h2><div class="scroll"><table class="thr"><thead><tr><th class="r">出手單位</th><th style="max-width:none">武器</th><th>幾把</th><th class="r">打誰</th></tr></thead><tbody>${SR.plan.map(p=>`<tr><td class="r" data-l="出手單位"><span>${esc(p.unit)}</span></td><td data-l="武器">${esc(p.weapon)}</td><td data-l="幾把">${p.n}</td><td class="r" data-l="打誰"><span>${esc(p.target)}</span></td></tr>`).join('')}</tbody></table></div>
    <h2 style="margin-top:10px">每個目標的結果</h2><div class="scroll"><table class="thr"><thead><tr><th class="r">目標</th><th>分數</th><th>打死機率<br><small>整隊全滅</small></th><th>平均死幾隻</th><th>平均打死的分數</th></tr></thead><tbody>${SR.targets.map(t=>`<tr><td class="r" data-l="目標"><span>${esc(t.name)}</span></td><td data-l="分數">${t.points}</td><td data-l="全滅機率"><b>${pct(t.p_wipe)}%</b></td><td data-l="平均死幾隻">${t.dead} / ${t.models}</td><td data-l="打死的分數">${t.value}</td></tr>`).join('')}</tbody></table></div>
    <p class="mute" style="margin:8px 0 0">對照：全部集火同一個目標 → ${SR.focus.map(f=>`${esc(f.name)} ${f.value} 分`).join('；')}</p></div>`;
  }
  return h;
}
async function runTest(){
  if(!SC.att.length||!SC.tgt.length){$('scmsg').textContent='兩邊都要至少勾一個。';return}
  const a=$('a').value,b=$('b').value,opt={abil:over};['half','cover','charge','still'].forEach(k=>opt[k]=$(k).checked);
  const req={a,b,opt,scenario:{att:SC.att,tgt:SC.tgt,melee:SC.melee,rev:SC.rev}};
  $('scgo').disabled=true;
  try{
    let j;
    if(window.localCalc) j=await localCalc(req,t=>$('scmsg').textContent=t);
    else{const r=await fetch('/api/calc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});j=await r.json();if(!r.ok)throw new Error(j.error||r.status)}
    if(j.error){$('scmsg').textContent=j.error;$('scgo').disabled=false;return}
    SR=j;render();
  }catch(e){$('scmsg').textContent='算不出來：'+e.message;$('scgo').disabled=false}
}
function render(){
  if(!R) return;
  const ok=P&&P.ab.length===R.ab.length&&P.ba.length===R.ba.length&&(P.ab[0]||[]).length===(R.ab[0]||[]).length;
  const pab=ok?P.ab:null,pba=ok?P.ba:null;
  let note='';
  if(ok){const x=changed(R.ab,pab),y=changed(R.ba,pba);
    note=`<div class="note">${x+y?`跟上一次比：「A 打 B」有 <b>${x}</b> 格變了、「B 打 A」有 <b>${y}</b> 格變了（粗框的格子，▲▼ 是變了幾個百分點）。`:'跟上一次比：沒有任何格子改變。可能是這個能力對這些目標沒作用，或它的條件沒成立（標「衝鋒時／半射程內／沒移動時」的，要同時勾最上面那個選項）。'}</div>`}
  const seg=`<div class="card"><div class="opts seg"><span>表格顯示：</span>${[['both','射擊＋近戰'],['shoot','只看射擊'],['melee','只看近戰']].map(([k,t])=>`<button data-m="${k}" class="${mode===k?'on':''}">${t}</button>`).join('')}<small>格子＝平均一輪殺掉目標幾 %（點一下格子看射擊／近戰各多少）</small></div></div>`;
  const tabs=`<div class="card"><div class="opts seg">${[['sum','總覽'],['test','單位測試（分槍）'],['data','規則和數據']].map(([k,t])=>`<button data-v="${k}" class="${view===k?'on':''}">${t}</button>`).join('')}</div></div>`;
  let body='';
  if(view==='sum') body=`<div class="grid">${sideMini(R.a,'la','A',R.sum_ab)}${sideMini(R.b,'lb','B',R.sum_ba)}</div>
  ${planCard('A','la','B',R.a,R.b,R.ab,R.thr_a)}${planCard('B','lb','A',R.b,R.a,R.ba,R.thr_b)}
  <div class="card"><div class="opts tsort seg"><span>先打誰的排序：</span><button data-s="score" class="${tsort==='score'?'on':''}">依優先分數</button><button data-s="threat" class="${tsort==='threat'?'on':''}">依威脅</button>
  <small>威脅＝它射擊和近戰各打最賺的目標，一輪平均殺幾分。要花＝從打它最痛的單位加起，加到剛好打掉為止的分數。優先分數＝威脅 ÷ 要花 × 100。近戰威脅是假設它衝得到。</small></div></div>
  ${threatCard('A','la','B',R.thr_a)}${threatCard('B','lb','A',R.thr_b)}`;
  else if(view==='test') body=testCard();
  else body=`<div class="grid">${sideCard(R.a,'la','A',R.sum_ab,R.b,'a')}${sideCard(R.b,'lb','B',R.sum_ba,R.a,'b')}</div>
  <p class="mute" style="font-size:12px;margin-top:-4px">* 殺分：每個單位都打自己最賺的那個目標，加起來的平均殺分。同一個目標會被重複算，只能拿來比兩邊大小。</p>
  ${valuesCard('A','la',R.values&&R.values.a)}${valuesCard('B','lb',R.values&&R.values.b)}
  ${seg}${note}
  ${matrix('A 打 B','la',R.a,R.b,R.ab,pab)}${matrix('B 打 A','lb',R.b,R.a,R.ba,pba)}`;
  $('out').innerHTML=tabs+body;
  $('upd').textContent='（更新到 '+R.data_updated+'）';
  document.querySelectorAll('td[data-tip]').forEach(c=>c.onclick=()=>{const t=$('tip');t.textContent=c.dataset.tip;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',c.dataset.tip.length>80?9000:4000)});
  document.querySelectorAll('.seg button[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
  document.querySelectorAll('button[id^="wv_"]').forEach(b=>b.onclick=()=>{window.wantVals=true;go()});
  document.querySelectorAll('.seg button[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  document.querySelectorAll('input[data-sc]').forEach(c=>c.onchange=()=>{const k=c.dataset.sc,v=+c.value;SC[k]=c.checked?[...new Set([...SC[k],v])]:SC[k].filter(x=>x!==v);SR=null;render()});
  document.querySelectorAll('.seg button[data-scm]').forEach(b=>b.onclick=()=>{SC.melee=b.dataset.scm==='1';SR=null;render()});
  document.querySelectorAll('.seg button[data-scr]').forEach(b=>b.onclick=()=>{const r=b.dataset.scr==='1';if(r!==SC.rev){SC.rev=r;SC.att=[];SC.tgt=[];SR=null}render()});
  const sb=$('scgo'); if(sb) sb.onclick=runTest;
  document.querySelectorAll('input[data-key]').forEach(c=>c.onchange=()=>{over[c.dataset.side][c.dataset.key]=c.checked;go()});
  document.querySelectorAll('details[data-ab]').forEach(d=>d.ontoggle=()=>{window['open_'+d.dataset.ab]=d.open});
  document.querySelectorAll('details[data-dt]').forEach(d=>d.ontoggle=()=>{window['dopen_'+d.dataset.dt]=d.open});
  document.querySelectorAll('details[data-fd]').forEach(d=>d.ontoggle=()=>{window['fopen_'+d.dataset.fd]=d.open});
  document.querySelectorAll('button[data-pv]').forEach(b=>b.onclick=()=>{pv=b.dataset.pv;render()});
  document.querySelectorAll('.tsort button').forEach(b=>b.onclick=()=>{tsort=b.dataset.s;render()});
}
async function go(){
  $('msg').textContent='';
  const a=$('a').value,b=$('b').value;
  if(!a.trim()||!b.trim()){$('msg').textContent='兩張軍表都要貼。';return}
  try{localStorage.setItem('mu_a',a);localStorage.setItem('mu_b',b)}catch(e){}
  const same=a===last.a&&b===last.b&&!!R;
  if(a!==last.a||b!==last.b){SC.att=[];SC.tgt=[]} SR=null;
  if(a!==last.a){over.a={};last.a=a} if(b!==last.b){over.b={};last.b=b}
  const opt={abil:over,values:!!window.wantVals};['half','cover','charge','still'].forEach(k=>opt[k]=$(k).checked);
  $('go').disabled=true;
  try{
    let j;
    if(window.localCalc){                      // 公開版：沒有伺服器，browser.js 在瀏覽器裡算
      j=await localCalc({a,b,opt},t=>$('msg').textContent=t);
    }else{
      const r=await fetch('/api/calc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,b,opt})});
      j=await r.json();
      if(!r.ok) throw new Error(j.error||r.status);
    }
    P=same?R:null; R=j;
    const miss=[];if(!j.a.units.length)miss.push('A');if(!j.b.units.length)miss.push('B');
    if(miss.length)$('msg').textContent=miss.join('、')+' 讀不到任何單位。請確認是官方 App 匯出的文字。';
    render();
  }catch(e){$('msg').textContent='算不出來：'+e.message}
  $('go').disabled=false;
}
$('go').onclick=go;
async function tr(){                                       // 英文軍表翻成中文（單位名用官方中文，武器對不到的保留英文）
  $('msg').textContent='';
  const a=$('a').value,b=$('b').value;
  if(!a.trim()&&!b.trim()){$('msg').textContent='先貼英文軍表。';return}
  $('tr').disabled=true;
  try{
    let j;
    if(window.localCalc){j=await localCalc({translate:true,a,b},t=>$('msg').textContent=t)}
    else{const r=await fetch('/api/calc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({translate:true,a,b})});j=await r.json();if(!r.ok)throw new Error(j.error||r.status)}
    const card=(k,t)=>{const x=j[k];if(!x||!x.zh.trim())return'';
      const kept=[x.units_kept.length?`單位沒有中文：${x.units_kept.map(esc).join('、')}`:'',x.items_kept.length?`武器／模型保留英文 ${x.items_kept.length}／${x.items} 個`:''].filter(Boolean).join('；');
      return `<div class="card"><div class="opts"><b>${t}</b><button type="button" data-cp="${k}">複製</button><button type="button" data-put="${k}">放回上面的輸入框</button><small>${kept||'全部都有中文'}</small></div><pre style="white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;margin:8px 0 0">${esc(x.zh)}</pre></div>`};
    $('trout').innerHTML=card('a','我方軍表（中文）')+card('b','對方軍表（中文）');
    document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(j[b.dataset.cp].zh);b.textContent='已複製'});
    document.querySelectorAll('[data-put]').forEach(b=>b.onclick=()=>{$(b.dataset.put).value=j[b.dataset.put].zh;b.textContent='已放回'});
  }catch(e){$('msg').textContent='翻不出來：'+e.message}
  $('tr').disabled=false;
}
$('tr').onclick=tr;
['half','cover','charge','still'].forEach(k=>$(k).onchange=()=>{if(R)go()});
try{$('a').value=localStorage.getItem('mu_a')||'';$('b').value=localStorage.getItem('mu_b')||''}catch(e){}
</script>
